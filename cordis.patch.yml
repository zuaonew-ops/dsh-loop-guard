# dsh-loop-guard 的 bundle 补丁。
#
# 只插入一行。这一行的 config 全部可选，未写的用 index.js 里的默认值。
#
# 可调项：
#   enabled             boolean 默认 true   —— false 则三个监听都不装，完全不干预
#   reasoningChunkLimit number  默认 20000  —— 推理分片数上限（≥ 100）。
#                                              只在「产出分片（文本/工具调用）为 0」时才算数
#   stallTimeoutMs      number  默认 180000 —— 零分片沉默上限（毫秒，≥ 10000）。
#                                              连续这么久一个分片都没收到就判定卡死；首块之前也算
#   noOutputMs          number  默认 600000 —— 零产出渗流上限（毫秒，≥ 10000），10 分钟。
#                                              分片在慢慢来但**产出始终为 0**，累计到这么久就判死。
#                                              ⚠ 五条规则里最可能误杀的一条（正常的长思考也会「产出为 0」）
#   repeatWindowChars   number  默认 6000   —— 输出退化重复的检测窗口（字符，1000..200000）。
#                                              只看最近这么多字符，不累积整段历史
#                                              重算节流：默认窗口 256 字符；窗口调大时按
#                                              max(256, 窗口/32) 放宽（20000→625、60000→1875、
#                                              200000→6250）；**窗口刚满时补算一次**；
#                                              **流结束时补算一次并只判 repeat**（v0.5.1）
#   repeatMinChars      number  默认 1000   —— 判据的**最低字符门槛**（500..repeatWindowChars）：
#                                              窗口短于它就不判，取代原来「窗口必须满」的前置。
#                                              设成等于 repeatWindowChars 即退回 v0.4 语义（只判满窗）
#                                              （契约修订 5 新增）
#   repeatMinLines      number  默认 30     —— 窗口内最少非空行数（5..5000），不够就不判
#   repeatCycles        number  默认 6      —— 最少重复轮数（2..100）：窗口内**最高频那一行**
#                                              至少出现该次数才判（判据由契约修订 2 改定）
#   repeatUniqueRatio   number  默认 0.2    —— 唯一行占比上限（0.01..0.9）
#   repeatGramRatio     number  默认 0.10   —— k-gram 兜底（0.01..0.9）：窗口 ≥ repeatMinChars 且
#                                              非空行数 < repeatMinLines 时，把子窗按 8 字符切成
#                                              不重叠片段（先做空白压缩），唯一片段占比 ≤ 该值就判
#                                              （契约修订 3 引入；默认值由修订 4 从 0.35 降到 0.10；
#                                              前置由修订 5 从「窗口已满」改成「窗口 ≥ repeatMinChars」）。
#                                              单行块的唯一行占比恒为 1.0，行判据结构上不可能
#                                              命中，只能靠它兜底。
#                                              ⚠ 调高更容易误杀长单行自然语言：实测中文自然散文
#                                              单行约 0.36、英文约 0.45，而真退化单行只有 0.007–0.009
#   attemptBudgetMs     number  默认 1800000—— 绝对时间上限（毫秒，≥ 10000），30 分钟，**不看产出**
#   maxGuardedRetries   number  默认 1      —— 允许的纠正重试次数（0..5）。0 = 拦到就终结
#   lowerEffortOnRetry  boolean 默认 true   —— 纠正重试时把 reasoningEffort 降一档
#   settingsPath        string  默认 ''     —— 界面设置的持久化文件；留空用
#                                              $DSH_HOME/loop-guard-settings.json
#   maxRecent           number  默认 50     —— 设置页里「最近触发」保留多少条（1..500）
#   debug               boolean 默认 false  —— 把每次拦截写进宿主日志
#
# 触发条件（五条，任一命中即提前掐断本次尝试，优先级从上到下）：
#   1. chunk    推理分片数 ≥ reasoningChunkLimit  且 产出分片为 0     ← 分片洪水
#   2. stall    连续 ≥ stallTimeoutMs 一个分片都没收到               ← 卡住不动
#   3. noOutput 已耗时   ≥ noOutputMs             且 产出分片为 0     ← 慢速渗流
#   4. repeat   前置（契约修订 5）：窗口 ≥ repeatMinChars（默认 1000）—— 取代原来「窗口必须满」
#               指标口径：在枚举出的子窗（尺度 = repeatMinChars × 2^k，再加窗口本身）里取**最坏值**，
#               行判据用分段最坏值 segRatio / segLines / segTopCount：
#               行判据：某子窗 非空行数 ≥ repeatMinLines 且 唯一行占比 ≤ repeatUniqueRatio
#                       且 最高频那一行次数 ≥ repeatCycles
#               或 k-gram 兜底：窗口 非空行数 < repeatMinLines 且 某子窗 8 字符不重叠片段
#                       唯一率（空白压缩后算）≤ repeatGramRatio（分段最坏值 segGramRatio）
#                                                                    ← 输出退化重复（思考里尤其常见）
#   5. absolute 已耗时   ≥ attemptBudgetMs（不看产出）               ← 最后兜底
#
# 条件 1、3 都带「产出为 0」这个必要条件：**只要模型真的在出文本或调工具，它们绝不插手**，
# 这是防误杀正常长推理的关键。条件 2 是「沉默」—— 沉默就是沉默，有没有出过文本都拦。
# 条件 4 是唯一按**文本形状**判的：行判据看窗口里「行数 vs 唯一行数」，k-gram 兜底看「8 字符片段
# vs 唯一片段」（单行/少行时唯一行占比恒为 1.0，行判据结构上不可能命中），都不看分片数、不看耗时、
# 不看产出（所以「分片一直在来、也有产出」的退化循环只有它拦得住）。条件 5 是真正的最后兜底，
# 边界是「单次尝试超过 30 分钟无条件切断」，README 里明写。
#
# ✅ 短块缺口已在 v0.5 修掉（v0.4 时这里是「已知限制，本轮明确不修」）：前置从「窗口必须满
#   repeatWindowChars(6000)」换成「窗口 ≥ repeatMinChars(1000)」+ 多尺度子窗最坏值，语料里
#   7 个真退化短块（2,029–4,521 字符，k8 0.2554–0.3497）**7/7 命中**（19/8 在 1,024 字符处触发、
#   18/59 在 2,560 字符处触发）。**不是**靠放宽 k-gram 阈值：那 7 个短块的 k8 与中文长单行自然
#   散文（0.3613）只差 1.03×，k-gram 口径下没有可用分界；它们的**行**指标才干净
#   （19/8：179 行 / 唯一行占比 0.0782 / Emit. ×80），所以正解是降低字符门槛让行判据看得到它们。
#   同一处改动还补掉了「稀释边界」：前置 400 字符高熵 + 5,600 字符重复 → 整窗 k8 只有 0.0907；
#   各占一半的 3,000+3,010 → 整窗 k8 0.5080 完全不触发。README §7 明写。
#
# 版本演进（每一条都来自对抗式验证的实测结论，不是拍脑袋）：
#   v0.1 → v0.2：删掉 time 规则（「已耗时 ≥ 240 秒且产出为 0」）—— productiveDeltas 不含
#     推理分片，所以「先长时间思考、再开始作答」的正常请求会在 4 分钟处被误杀。
#     新增 stall 规则：实测最坏用例（主会话 3.48 小时卡死）是**零分片空档**
#     （1.95h + 1.5h 没有任何分片），而 v0.1 只在拿到分片后才评估，对它完全无效。
#     absolute 从「预算 × 3 = 12 分钟」改成独立的 30 分钟：实测一条一直在正常出文本的
#     流会在 12 分钟被无条件切断。
#   v0.2 → v0.3：补回 noOutput 规则（默认 600 秒，比 v0.1 被删的那条宽松 2.5 倍）。
#     独立验证者用真实语料找出决定性反例：真机上真实发生过的那次循环是 5,450 个推理分片、
#     256 秒（≈47 毫秒一片，全程没有任何 ≥ 180 秒空档）、产出 0 ——
#     chunk 要 ≥ 20000 片（不够）、stall 要 ≥ 180 秒空档（没有）→ 三条规则一条都不命中，
#     只能等 30 分钟。这类「慢速渗流循环」现在 10 分钟就被拦下。
#   v0.3 → v0.4：新增 repeat 规则（输出退化重复）。实测会话 session-b0a019e8 的 reasoning 块退化成
#     短句循环：「Let me go.」在单块里出现 3,052–3,332 次，单块 85,705–102,796 字符，
#     唯一行占比 0.5%–3.8%，stopReason 为 length 或被用户手动中止 —— v0.3 的四条规则
#     **一条都不命中**：分片一直在来（stall 不触发）、推理分片数没到 20000（chunk 不触发）、
#     产出分片 > 0（noOutput 不触发）、耗时没到 30 分钟（absolute 不触发）。
#     所以新增的不是「调阈值」而是「换判据」：不看分片数/耗时/产出，只看最近一段窗口里
#     文本自身的重复度（行数 vs 唯一行数）。
#   v0.4 冻结后（三次修订：修订 2/3 来自独立验证者的量化结论，修订 4 来自 lead 的对抗样本实测）：
#     修订 2 —— repeatCycles 的判据从「行数 ≥ 轮数 × 唯一行数」改成「最高频那一行出现次数 ≥ 轮数」。
#       旧判据会真漏检 turn 24/1（12,201 字符 / 376 行 / 唯一行占比 32.4% / 「Let me go.」×233）：
#       它末窗口 312 行 / 60 唯一 / ratio=0.1923（占比已达标），只差 312 < 6×60=360 这一条。
#       全语料里「占比达标却被旧判据漏掉」的记录只有这 1 条，改后误杀面仍为 0。
#     修订 3 —— 新增 repeatGramRatio（k-gram 兜底）。**单行块**的「唯一行占比」恒等于 1.0，行判据对
#       它结构上不可能命中（这是缺口，不是阈值问题）。全语料 338 会话 / 19,624 个 reasoning+text 块 /
#       40,340,284 字符：满窗且行数 < 30 的 414 个块里，k8 ≤ 0.35 的只有 2 个真退化块
#       （0.0067 / 0.0093），其余 412 个全部 ≥ 0.8800（断层 95 倍）→ 命中 2 / 误杀 0；
#       满窗且行数 ≥ 30 的 1,013 个块里，k8 ≤ 0.35 的 19 个**全部**已被行判据命中（兜底不额外扩大命中面）。
#     修订 4 —— repeatGramRatio 默认值 0.35 → 0.10（范围 0.01..0.9 不变）。lead 用真实
#       countChunk+detectTrip（64 字符分片、6000 字符满窗）实测：0.35 会误杀长单行自然语言 ——
#       中文自然散文单行 0.3613（余量只剩 3%）、英文自然散文单行 0.4520、中文编号列表压成一行
#       0.2733、中文模板句重复 0.2293、中文技术句重复 0.1920、中英混排代码单行 0.1760
#       （后四个在 0.35 下全部误杀）；真退化单行只有 0.0093 / 0.0067。取 0.10：对两个真退化有
#       10.7× / 14.9× 余量，对最低非退化样本（0.1760）有 1.76× 余量；全语料 414 个满窗单行块
#       在 0.10 下误杀仍为 0。用户仍可自行调高，但调高会更容易误杀长单行自然语言。
#   v0.4 → v0.5（契约修订 5：两处**结构性**缺口，结论来自全语料端到端重放）：`repeat` 的两条判据从
#     「整窗口径 + 窗口必须满 repeatWindowChars」改成「**多尺度子窗最坏值 + 窗口 ≥ repeatMinChars
#     （默认 1000）**」，并新增配置键 repeatMinChars（500..repeatWindowChars）。
#     ① 短块缺口（v0.4 时）：短于 6000 字符的真退化块窗口永远填不满 → 语料里 7 个真退化短块（2,029–4,521
#        字符，k8 0.2554–0.3497）全部漏检，现在 **7/7 命中**（19/8 在 1,024 字符处触发、
#        18/59 在 2,560 字符处触发）。不是靠放宽 k-gram 阈值 —— 那些短块的 k8 与中文长单行自然
#        散文 0.3613 只差 1.03×，没有可用分界；它们的**行**指标才干净（19/8：179 行 /
#        唯一行占比 0.0782 / Emit. ×80），所以正解是降低字符门槛让行判据看得到它们。
#     ② 稀释边界：退化只占窗口后半段时整窗指标被稀释（前置 400 字符高熵 + 5,600 字符重复 →
#        整窗 k8 只有 0.0907；各占一半的 3,000+3,010 → 整窗 k8 0.5080 完全不触发），现在由落在
#        退化段里的子窗抓到。
#     实测（真 countChunk/detectTrip 端到端重放）：340 会话 / 14,055 记录 / 19,920 块 /
#     40,953,283 字符 / 0 解码错误 → 命中 **221** 条记录（全部 repeat：c3e13580 215 + 1997d29e 6），
#     非退化会话命中 **0**；离线扫描：分段行判据(0.2) 命中 216、分段 k8(0.10) 命中 18、并集 218，
#     非退化命中 0。误杀余量：分段 k8 非退化最低 0.392（3.92×）、分段行判据非退化最低 0.2574（1.29×）。
#     ⚠ 这两个余量是**全语料非退化块**口径（6233 块）；「常量模板 + 只变计数器」形状（V10）的分段
#     k8 只有 0.1060（1.06×），且子窗相位噪声 ±30% —— 两个口径都要看，见 v0.5.1 段 ④。
#     ⚠ 一处**有意的行为变化**：「常量代码模板 + 只变计数器」整窗 k8 = 0.1760（v0.4 不触发），但
#     4,000 字符子窗 k8 = 0.0540 → v0.5 会触发；想要旧语义就把 repeatMinChars 设成等于 repeatWindowChars。
#   v0.5.0 → v0.5.1（独立验证 PASS 之后的修正，三条都来自验证者发现）：
#     ① k-gram 消息语义（F3，v0.4 起就有）：该分支的消息把「片段总数」说成了「不重复的片段数」——
#        「最近 6000 字符里只有 750 个 8 字符片段不重复」实际含义是「750 个片段里只有 7 个不重复」。
#        现在 gramRatioOf 返回 {count, unique, ratio}、state 新增 segGramUnique，消息改成
#        「最近 6000 字符里 750 个 8 字符片段不重复的只有 7 个（唯一率 0.9%，上限 10.0%；
#        非空行仅 1 行）。已中止本次尝试。」判据与其余文案一字未改，分支标记子串「片段不重复」保留。
#     ② 大窗口性能（验证者 v3 §6⑥ + v4 §F8）：节流间隔原为固定 256 字符。
#        **A 相（窗口未满）**：窗口 200000（UI 上限）时单次重算 78.6 ms、每输出 1000 字符烧
#        307 ms CPU → 现在按 repeatRecheckCharsOf(windowChars) = max(256, floor(windowChars/32))
#        放宽：6000→256（默认行为与检测时延一字不变）、20000→625、60000→1875、200000→6250，
#        上限下每 1000 字符约 12.6 ms（约 1/24）。
#        **B 相（窗口已满）**：v0.4 那句 `|| rep.window.length >= windowChars` 使窗口满之后每个
#        流分片都重算（真实 delta 中位 2 字符 → 默认窗口约 500 次重算/1000 字符 ≈ 106 ms CPU；
#        窗口 200000 + 64 字符分片时 1,296 ms / 1000 字符）。最终写法是**一次性满窗补算**：
#        fullNotYetChecked = rep.window.length >= windowChars && rep.checkedAt < windowChars
#        （与节流间隔用 || 连接）—— 满窗补算只发生一次、满窗后仍按 max(256, W/32) 节流，
#        B 相 1,296 ms → 约 13.5 ms / 1000 字符，判定时机与 v0.4 一致。
#        **不能直接删掉那个子句**：删掉后最后一次重算停在节流边界（默认 5888 = 256 的倍数），
#        满窗那一刻从来没被求值过（E 样本窗口 5888 时 segGramRatio 0.1040 不触发、6000 时才
#        0.0540 触发）→ 8 条断言转红、语料命中 221 → 219（_task-33-align.mjs 在 16–256 八种
#        分片粒度上稳定复现，不是对齐噪声）。
#        另外 guardStream 的 step.done 分支新增**流尾补算 + 只判 repeat**：节流让指标最多滞后
#        一个间隔，流尾那一小段否则可能整次没被求值过；只接受 repeat 规则，是因为
#        stall/noOutput/absolute 不依赖 recomputeRepeat 且已在每个分片后判过，在这里重判它们会让
#        「恰好结束于 noOutputMs 边界」的正常流凭空多出误判。
#        验证者建议的「lines >= repeatMinLines 时跳过子窗 k8（省 43–49%）」**没有采用**：那会让
#        缓存的 segGramRatio 依赖**重算时**的 repeatMinLines，而 detectTrip 可能拿**另一份** config
#        判 —— 作者单测 13.4e 立刻抓到了这个耦合。
#     ③ k-gram 消息窗口数字（F7）：消息里「最近 N 字符」的 N 原为整窗长度，而三个数字来自最差
#        子窗（于是出现「最近 1024 字符里 125 个片段」，125×8=1000≠1024）。现在改用 segGramScale，
#        短块消息变成「最近 1000 字符里 125 个 8 字符片段不重复的只有 7 个」，三个数字口径一致；
#        老 state 没有 segGramScale 就退回整窗长度（= v0.4 行为）。
#     ④ 文档口径（验证者 §6⑤）：README 现在同时给出「全语料非退化块」口径（6233 块，分段 k8
#        最低 0.392 = 3.92×）与「常量模板 + 只变计数器」形状口径（V10 分段 0.1060 = 1.06×），
#        并注明子窗对齐相位噪声（平移 0–255 字符，最差子窗 k8 在 0.1060–0.1720 漂移，62% 极差
#        ≈ ±30%）。语料里仍是 0 误杀（6233 个非退化块 0 命中，最近距离 1.29×）。
#
# 界面里改的设置（总开关、十一个阈值、降档开关）会原子写进 settingsPath，
# **重启后优先于这份 yml**。想回到 yml 的值就删掉那个文件。
#
# 软依赖（ctx.inject，缺了不报错，只是少一项能力）：
#   webServer —— 设置页要用的 HTTP 路由。没有它守卫照样工作，只是没有界面。
#
# 注意：这一行**热装**进正在运行的宿主时，浏览器半区可能进不了 boot graph
# （宿主对 dsh.client 的扫描是增量的，否定结论缓存到进程重启）。
# 装完重启一次 DSH 宿主即可。

- insert:
    - id: loop-guard
      name: 'dsh-loop-guard'
      config: {}
